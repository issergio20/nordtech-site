# Демо-версия вёрстки на GitHub Pages:
#   вариант 1 (UI kit nordtech.su) — https://issergio20.github.io/nordtech-site/
#   вариант 2 (новая дизайн-система «НОРД Тёмный», шаблоны site/src-v2) — https://issergio20.github.io/nordtech-site/v2/
# Собирается при каждом push в main. Заявки на демо никуда не отправляются (нет сервера), сайт закрыт от индексации.
name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Вариант 1
        run: npx @11ty/eleventy
        env:
          PATH_PREFIX: /nordtech-site/
          DEMO: "1"
      - name: Вариант 2
        run: npx @11ty/eleventy --output=_site/v2
        env:
          PATH_PREFIX: /nordtech-site/v2/
          DEMO: "1"
          VARIANT: "2"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
